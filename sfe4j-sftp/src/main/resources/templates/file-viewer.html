<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title th:text="${title}">File Viewer</title></head>
<body>
<h2 th:text="${preview.fileName}"></h2>
<div th:if="${preview.previewable}">
    <pre th:text="${preview.content}"></pre>
</div>
<div th:if="${!preview.previewable}">
    <p th:text="${preview.message}"></p>
</div>
<p><a th:href="@{/file-downloader(file=${preview.path})}">Download</a></p>
</body>
</html>
